name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'docs/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ─── Install ────────────────────────────────────────────────────────────────
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

  # ─── Type check ─────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Typecheck
        run: pnpm typecheck

  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gbmis
          POSTGRES_PASSWORD: gbmis
          POSTGRES_DB: gbmis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://gbmis:gbmis@localhost:5432/gbmis_test

      - name: Run migrations on test DB
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://gbmis:gbmis@localhost:5432/gbmis_test

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://gbmis:gbmis@localhost:5432/gbmis_test
          ENCRYPTION_KEY_CURRENT_ID: "1"
          ENCRYPTION_KEY_1: "test-key-32-bytes-exactly-padded"
          ENCRYPTION_HMAC_SECRET: "test-hmac-secret-32-bytes-padded"

  # ─── OpenAPI drift check ────────────────────────────────────────────────────
  openapi:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Check OpenAPI spec drift
        run: pnpm --filter=@gb-mis/api openapi:check
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: gb-mis
          KEYCLOAK_CLIENT_ID: gb-mis-api
          KEYCLOAK_CLIENT_SECRET: placeholder
          REDIS_URL: redis://localhost:6379
          ENCRYPTION_KEY_CURRENT_ID: '1'
          ENCRYPTION_KEY_1: test-key-32-bytes-exactly-padded
          ENCRYPTION_HMAC_SECRET: test-hmac-secret-32-bytes-padded

  # ─── API Contract (Schemathesis static schema validation) ──────────────────
  # Schema-level validation only: confirms the OpenAPI document is well-formed
  # and that Schemathesis can derive test cases from it. Live-API contract
  # testing (which requires Keycloak + a seeded DB in CI) is a follow-up.
  contract:
    name: API Contract (Schemathesis dry-run)
    runs-on: ubuntu-latest
    needs: openapi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Schemathesis
        run: pip install --quiet 'schemathesis>=3.36,<4'

      - name: Validate OpenAPI document
        run: |
          schemathesis run \
            --dry-run \
            --hypothesis-max-examples=5 \
            --validate-schema=true \
            apps/api/openapi.json

  # ─── E2E (Playwright + axe-core) ────────────────────────────────────────────
  e2e:
    name: E2E (web)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
            services/*/node_modules
          key: node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Install Playwright browsers
        run: pnpm --filter=@gb-mis/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter=@gb-mis/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # The web build must succeed without runtime services. Any value the
          # build needs at compile time is set via NEXT_PUBLIC_* vars below.
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3010

      - name: Run Playwright + axe-core e2e
        run: pnpm --filter=@gb-mis/web e2e
        env:
          CI: '1'
          NEXTAUTH_SECRET: ci-test-secret-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3010

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ─── SAST ───────────────────────────────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  # ─── Docker build smoke tests ────────────────────────────────────────────────
  docker:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, e2e, contract]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: gb-mis-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: gb-mis-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
